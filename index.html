function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML;}
function companyGuess(text){const m=String(text).match(/\b(?:at|by|for)\s+([A-Z][a-zA-Z]+(?:\s+[A-Z][a-zA-Z]+)*)/);return m?m[1]:'غير محدد';}
function fmtDate(iso){try{const d=new Date(iso);return isNaN(d)?'':d.toLocaleDateString('ar-EG');}catch(_){return '';}}

function render(){
const list=document.getElementById('jobs-list');
const q=document.getElementById('search').value.trim().toLowerCase();
const sf=document.getElementById('sourceFilter').value;
let html='';
let shown=0;
jobs.forEach(j=>{
if(q && !(j.title+' '+j.description).toLowerCase().includes(q)) return;
if(sf && j.source!==sf) return;
shown++;
html+=`<div class="job">
<div class="title">${esc(j.title)}</div>
<div class="desc">${esc(j.description)}</div>
<div class="meta">🏢 الشركة: ${esc(companyGuess(j.title+' '+j.description))} &nbsp;|&nbsp; 📍 المصدر: ${esc(j.source)} &nbsp;|&nbsp; 🕐 أضيفت: ${esc(fmtDate(j.found_at))}</div>
<a href="${esc(j.url)}" class="apply-btn" target="_blank" rel="noopener">تقديم ↗</a>
</div>`;
});
document.getElementById('countBadge').textContent = shown + ' وظيفة معروضة من ' + jobs.length;
list.innerHTML = html || '<p style="text-align:center;color:#888;">لا توجد نتائج مطابقة.</p>';
}

// populate source filter
const sources=[...new Set(jobs.map(j=>j.source))];
const sel=document.getElementById('sourceFilter');
sources.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});

document.getElementById('search').addEventListener('input',render);
sel.addEventListener('change',render);
document.addEventListener('DOMContentLoaded',render);
</script>
